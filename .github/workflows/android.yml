name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the APK to (e.g. v1.31.1). Leave empty to only keep the file as a download.'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK (already on the runner), accept licenses and add what we need
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || true
      - name: Build web layer
        run: cd mobile && npm ci && node build.js
      - name: Get Gradle (tries several download sources, so one GitHub outage cannot stop the build)
        run: |
          mkdir -p "$HOME/gl"; ok=0
          for u in https://services.gradle.org/distributions/gradle-8.9-bin.zip https://mirrors.cloud.tencent.com/gradle/gradle-8.9-bin.zip https://downloads.gradle.org/distributions/gradle-8.9-bin.zip; do
            for i in 1 2 3; do
              rm -f "$HOME/gl/g.zip"
              if curl -fL --connect-timeout 20 --max-time 300 -o "$HOME/gl/g.zip" "$u" && unzip -tq "$HOME/gl/g.zip" > /dev/null 2>&1; then ok=1; break 2; fi
              echo "Download from $u failed (try $i). Waiting..."; sleep 15
            done
          done
          if [ "$ok" = 1 ]; then
            echo "Gradle downloaded. Using the local copy."
            sed -i "s#^distributionUrl=.*#distributionUrl=file\\://$HOME/gl/g.zip#; s#^validateDistributionUrl=.*#validateDistributionUrl=false#" android/gradle/wrapper/gradle-wrapper.properties
            grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          else
            echo "Could not pre-download Gradle. Falling back to the normal wrapper download with retries."
          fi
      - name: Build APK
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3 4 5; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Gradle attempt $i failed (usually a temporary download problem). Waiting before the next try..."
            sleep $((i * 30))
          done
          exit 1
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FutureSelf.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FutureSelf-android-apk
          path: FutureSelf.apk
      - name: Attach the APK to the release (tag push, or a manual run with a tag filled in)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: FutureSelf.apk
          overwrite_files: true